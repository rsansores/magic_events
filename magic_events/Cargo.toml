[package]
name = "magic_events"
description = "Events that leave PostgreSQL only if the transaction that raised them committed, and always leave if it did: a transactional outbox relayed to NATS JetStream as CloudEvents"
keywords = ["events", "outbox", "postgres", "nats", "cloudevents"]
categories = ["database", "asynchronous"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../README.md"
documentation = "https://docs.rs/magic_events"

[features]
# `consume`: a Rust consumer of the stream, for a system that reads the
# events and for a host's tests.
consume = []

[dependencies]
async-nats = { version = "0.50", default-features = false, features = ["jetstream", "ring", "server_2_10"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
futures-util = { version = "0.3", default-features = false }
magic_events_derive = { version = "=0.1.0", path = "../magic_events_derive" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio", "derive", "uuid", "chrono", "json"] }
thiserror = "2"
# The broker's times, unless something enables async-nats' `chrono`.
time = { version = "0.3", default-features = false }
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["serde", "v7"] }

[package.metadata.docs.rs]
all-features = true

[dev-dependencies]
# `#[sqlx::test]`, which builds a database of its own for each test.
sqlx = { version = "0.8", default-features = false, features = ["macros", "migrate"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
trybuild = "1"
ts-rs = { version = "12", features = ["chrono-impl", "uuid-impl", "serde-compat", "no-serde-warnings"] }

# The README's code needs every feature it shows.
[[test]]
name = "readme"
required-features = ["consume"]
