name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release runs it on the commit it releases, and publishes only once it
  # is green.
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Formatting, clippy and the docs, of the crates — with `consume` and
  # without — and of the shop example.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            .
            examples/shop
      - run: cargo fmt --all --check
      - run: cargo fmt --manifest-path examples/shop/Cargo.toml --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo clippy --locked --manifest-path examples/shop/Cargo.toml --all-targets -- -D warnings
      - run: cargo doc --locked --no-deps --workspace --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  # What the crates depend on, and what the example does (it has a lockfile
  # of its own): advisories, licenses, sources, and nothing declared that
  # nothing uses.
  dependencies:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        manifest:
          - Cargo.toml
          - examples/shop/Cargo.toml
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          manifest-path: ${{ matrix.manifest }}
          command: check
          arguments: --locked
  unused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: cargo-machete
      - run: cargo machete . examples/shop

  # The workflows themselves: an action not pinned to a commit, a token
  # that outlives its step, an expression a pull request can inject into a
  # script.
  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          inputs: .github
          advanced-security: false
          annotations: true
          version: 1.30.1
          # `$/…` for the release's call of this file is too new to rely on.
          min-severity: medium

  # The suite, against the oldest PostgreSQL it supports and the newest: each
  # test creates a database of its own, and a stream of its own on one
  # JetStream server.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        postgres: ["14", "18"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      NATS_URL: nats://localhost:4222
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # A service container takes no arguments, and JetStream is one (`-js`).
      - name: A NATS server with JetStream
        run: |
          docker run -d --name nats -p 4222:4222 nats:2.15.1 -js
          for _ in $(seq 30); do
            docker logs nats 2>&1 | grep -q "Server is ready" && exit 0
            sleep 1
          done
          docker logs nats
          exit 1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # The matrix is not part of the job it keys by.
          key: postgres-${{ matrix.postgres }}
      - run: cargo test --locked --workspace --all-features

  # The derive's refusals, with the compiler's own words: held to the one
  # rustc the messages checked in were written with (`magic_events/tests/derive.rs`
  # names it; the other jobs build what the derive accepts and leave the
  # words alone).
  diagnostics:
    runs-on: ubuntu-latest
    env:
      MAGIC_EVENTS_PINNED_DIAGNOSTICS: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.97.1"
          # The expected messages quote the crate's source, as rustc shows it.
          components: rust-src
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --locked -p magic_events --test derive

  # What a host can name is what magic_events/public-api/ lists: a change to
  # it is made there too, on purpose, and reviewed as one. The listing is
  # read off rustdoc's JSON, so the nightly is pinned.
  public-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly-2026-10-10
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: cargo-public-api@0.52.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: |
          cargo +nightly-2026-10-10 public-api -p magic_events --all-features -s > "$RUNNER_TEMP/all-features.txt"
          diff -u magic_events/public-api/all-features.txt "$RUNNER_TEMP/all-features.txt"

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo check --locked --workspace --all-features

  # The shop: its programs build against the crate as it is.
  example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: examples/shop
      - run: cargo build --locked --manifest-path examples/shop/Cargo.toml

  # The shop's events page: a Vue app over the dashboard, built from source.
  example-page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: dashboard/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile --ignore-scripts && pnpm build
        working-directory: dashboard
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: examples/shop/web
      - run: pnpm format:check && pnpm lint && pnpm build
        working-directory: examples/shop/web

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # The pnpm version comes from package.json's `packageManager`.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: dashboard/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm format:check
      - run: pnpm lint
      # Checks the relay's answers in src/core/contract/fixtures/ against the
      # types generated from the crate's own, both of which the crate's tests
      # keep equal to what it serializes.
      - run: pnpm type-check
      - run: pnpm knip
      - run: pnpm test
      # Builds, packs, and lints the tarball as npm and TypeScript read it.
      - run: pnpm check:pack

  # Every link the documents and the rustdoc comments make into the
  # repository, anchors included, against the tree.
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: lychee@0.24.2
      - run: scripts/check-links.sh

  # What a release publishes, packed and built from the tarballs as
  # crates.io will; and one version everywhere.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: scripts/check-versions.sh
      - run: cargo package --locked --workspace
