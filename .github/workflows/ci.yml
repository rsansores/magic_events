name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release runs it on the commit it releases, and publishes only once it
  # is green.
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Formatting, clippy and the docs.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo doc --locked --no-deps --workspace
        env:
          RUSTDOCFLAGS: -D warnings

  # What the crates depend on: advisories, licenses, sources, and nothing
  # declared that nothing uses.
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
          arguments: --locked
  unused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: cargo-machete
      - run: cargo machete .

  # The workflows themselves: an action not pinned to a commit, a token
  # that outlives its step, an expression a pull request can inject into a
  # script.
  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          inputs: .github
          advanced-security: false
          annotations: true
          version: 1.30.1
          # `$/…` for the release's call of this file is too new to rely on.
          min-severity: medium

  # The suite, against the oldest PostgreSQL it supports and the newest: each
  # test creates a database of its own, and a stream of its own on one
  # JetStream server.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        postgres: ["14", "18"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      NATS_URL: nats://localhost:4222
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # A service container takes no arguments, and JetStream is one (`-js`).
      - name: A NATS server with JetStream
        run: |
          docker run -d --name nats -p 4222:4222 nats:2.15.1 -js
          for _ in $(seq 30); do
            docker logs nats 2>&1 | grep -q "Server is ready" && exit 0
            sleep 1
          done
          docker logs nats
          exit 1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # The matrix is not part of the job it keys by.
          key: postgres-${{ matrix.postgres }}
      - run: cargo test --locked --workspace

  # The derive's refusals, with the compiler's own words: held to the one
  # rustc the messages checked in were written with (`magic_events/tests/derive.rs`
  # names it; the other jobs build what the derive accepts and leave the
  # words alone).
  diagnostics:
    runs-on: ubuntu-latest
    env:
      MAGIC_EVENTS_PINNED_DIAGNOSTICS: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.97.1"
          # The expected messages quote the crate's source, as rustc shows it.
          components: rust-src
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo test --locked -p magic_events --test derive

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo check --locked --workspace
