# The actions are pinned to commits, and the lockfiles to versions; this moves
# both to the releases.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  # The dependencies themselves: the workspace, and the example with a
  # lockfile of its own.
  - package-ecosystem: cargo
    directories:
      - /
      - /examples/shop
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: npm
    directories:
      - /dashboard
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
