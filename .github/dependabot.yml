# The actions are pinned to commits, and the lockfiles to versions; this moves
# both to the releases.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  # The dependencies themselves: the workspace, and the example with a
  # lockfile of its own.
  - package-ecosystem: cargo
    directories:
      - /
      - /examples/shop
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # A host hands the crate its sqlx pools and its async-nats JetStream
    # context: a new release of either is a breaking release of the crate,
    # made on purpose, not a bump.
    ignore:
      - dependency-name: sqlx
        versions: [">= 0.9"]
      - dependency-name: async-nats
        versions: [">= 0.51"]
  - package-ecosystem: npm
    directories:
      - /dashboard
      - /examples/shop/web
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
